[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "hierboost"
version = "0.1.0"
description = "Hierarchical proximity-boosted spike-and-slab models (spatial + temporal), generalized from Johnston et al.'s GWAS dissertation work"
readme = "README.md"
requires-python = ">=3.9"
dependencies = [
    "numpy<2",
    "scipy",
    "scikit-learn",
    "matplotlib",
    "polyagamma",
]

[project.optional-dependencies]
# hierboost.latent (Chapter 4's discrete/binomial block-latent model) and hierboost.joint
# (joint NUTS inference) need JAX/NumPyro, which pull in numpy>=2 -- incompatible with the
# numpy<2 pin above (needed for scikit-learn/scipy). Install this extra into a SEPARATE
# virtualenv (see README), never alongside the base install.
jax = ["jax", "jaxlib", "numpyro"]

[tool.setuptools]
packages = ["hierboost"]
